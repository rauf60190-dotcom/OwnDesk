        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment_mode:
                    type: string
                  is_owner:
                    type: boolean
                  id:
                    type: string
                    format: uuid
                  membership_id:
                    type: string
                    format: uuid
                  username:
                    type: string
                  name:
                    type: string
                  role:
                    type: string
                  workspace:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      timezone:
                        type: string
                  preferences:
                    type: object
                    additionalProperties: true
                  development:
