openapi: 3.0.3
info:
  title: OwnDesk API
  version: 0.1.0
paths:
  /api/v1/attachments:
    post:
      operationId: attachments_create
      tags:
      - attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/attachments/{id}/download:
    get:
      operationId: attachments_download_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - attachments
      security:
      - cookieAuth: []
      responses:
