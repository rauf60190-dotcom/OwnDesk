name: Public visitor check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-visitor-check
  cancel-in-progress: false

jobs:
  deployed-portal:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir frontend exec playwright install chromium
      - name: Check the deployed portal without signing in
        shell: pwsh
        env:
          OWNDESK_SMOKE_OUTPUT: ${{ runner.temp }}/public-smoke
        run: node tools/ci_public_smoke.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployed-portal-guest-${{ github.run_id }}
          path: ${{ runner.temp }}/public-smoke/
          if-no-files-found: warn
          retention-days: 14
